# Builds the website and publishes it to GitHub Pages
# every time code is pushed to the "main" branch.
#
# One-time setup on GitHub:
#   Repository → Settings → Pages → "Build and deployment" → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also allows running it manually from the "Actions" tab.
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Reads your Pages settings. base_url is the live address,
      # e.g. https://user.github.io/al-zamzam-cooling or https://www.your-domain.com
      # (the /al-zamzam-cooling base path itself is set in next.config.ts).
      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload the "out" folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
